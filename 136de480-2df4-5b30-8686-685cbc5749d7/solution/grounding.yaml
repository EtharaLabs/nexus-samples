derivation_table:
- rule: graph-based propagation, late maximum and early minimum over the arcs into a pin
  source: 'stated: S3 (instruction.md Propagation)'
- rule: data arrivals kept apart per pin, transition, launching clock edge, and exception state
  source: 'stated: S3 (instruction.md Rules 3, Propagation)'
- rule: clock arrivals record the arc input that set them; ties go to the smaller (pin name, transition) pair; launch path traced from the launching clock pin at rise in the launch analysis, capture path
    from the capturing clock pin in the capture analysis, a latch hold from its closing transition
  source: 'stated: S15 (instruction.md CPPR, path tracing)'
- rule: CPPR credit is the late minus the early clock arrival at the last common pin, for the launch path's transition there, and 0 for opposite transitions, no shared pin, or ideal clocks
  source: 'stated: S16 (instruction.md CPPR, credit)'
- rule: latch opening time, open window, borrow limit (window plus closing minus opening early latency minus the setup constraint, never below 0), borrow clamped to [0, limit], setup slack opening plus
    borrow minus arrival
  source: 'stated: S17 (instruction.md Level-sensitive latches, setup and borrow)'
- rule: latch Q launches at the latch's own opening edge from the enable and from every borrowing D arrival less its S through the D-to-Q arc; early Q from the enable alone
  source: 'stated: S18 (instruction.md Level-sensitive latches, Q launch)'
- rule: generated clock waveform from the master through -multiply_by, -edges, or -divide_by as -edges {1, n+1, 2n+1}; latches on or fed from a generated clock use its own edges
  source: 'stated: S19 (instruction.md Generated clocks), cited: SDC 2.1 create_generated_clock'
- rule: setup edge pairing across unrelated clocks and with generated clocks over the common period
  source: 'stated: S12 (instruction.md Checks)'
- rule: a generated clock's source register output is a clock-network pin absent from arrivals
  source: 'stated: S14 (instruction.md Propagation)'
- rule: multicycle setup moves the capture edge, multicycle hold the launch edge, default hold follows setup
  source: 'stated: S5 (instruction.md Checks), cited: SDC 2.1 set_multicycle_path'
- rule: CPPR applies on propagated clocks only
  source: 'stated: S6 (instruction.md CPPR)'
- rule: false paths remove checks; -through lists match any one pin
  source: 'stated: S8 (instruction.md Exceptions)'
- rule: table lookup by template variable order with linear interpolation and extrapolation
  source: 'stated: S2 (instruction.md Lookup and loads), cited: Liberty NLDM lu_table_template'
- rule: timing_sense selects the input transitions of an arc
  source: 'cited: Liberty NLDM timing_sense'
- rule: net load from pin capacitance, set_load, and the default wire load at the fanout
  source: 'stated: S2 (instruction.md Lookup and loads)'
- rule: units from time_unit, capacitive_load_unit, and set_units; times reported in ns
  source: 'stated: S1 (instruction.md Units)'
- rule: OCV derates scale cell delay arcs only, late on late and early on early, clock and data separately
  source: 'stated: S4 (instruction.md OCV)'
- rule: setup with late data and early capture clock; hold with early data and late capture clock; constraint lookup slews
  source: 'stated: S5 (instruction.md Checks)'
- rule: latch transparency, opening and closing edges through the clock network's unateness, paths end at latch D, exceptions stop at a latch, latch hold at the closing edge
  source: 'stated: S7 (instruction.md Level-sensitive latches)'
- rule: 'ideal clocks: zero latency and set_clock_transition slew; propagated clocks from the source port at time 0'
  source: 'stated: S3 (instruction.md Propagation)'
- rule: report schema (wns_setup, tns_setup, wns_hold, tns_hold, endpoints, arrivals, borrow, pba_setup), null rules, WNS and TNS
  source: 'stated: S9 (instruction.md Report)'
- rule: exit status 0 with a report, 2 without one on malformed or out-of-subset input
  source: 'stated: S10 (instruction.md Exit status)'
- rule: grading tolerance 1e-6 ns, the 20 s run limit, the 0.9 compiled and 0.1 judged reward, and the exact-1.0 pass rule
  source: 'stated: S11, S21 (instruction.md What to deliver, Grading)'
- rule: 'hold relationship: setup relationship (with the multicycle setup shift) minus the smaller of the launch and capture periods minus the -hold multiplier times the launch period; a latch uses the
    setup relationship to its closing edge'
  source: 'stated: S20 (instruction.md Rules 5, Checks)'
- rule: each D1 run finishes within 20 s; a run over the limit fails every value of its case
  source: 'stated: S21 (instruction.md What to deliver, Grading)'
- rule: path-based re-timing of the 5 worst register and port setup endpoints along the path that set each graph slack, with path slews and the late data derate; capture side and CPPR as graph-based; pba_setup
  source: 'stated: S22 (instruction.md Rules 10, Path-based re-timing)'
- rule: a generated clock may be sourced from a pin clocked by another generated clock; waveform, source latency, and clock-path tracing apply through each level
  source: 'stated: S23 (instruction.md Rules 6, Generated clocks)'
- rule: periods need not be integer multiples; the common period is the least common multiple of the two periods as exact fractions; multicycle setup shifts by capture periods and multicycle hold by launch
    periods
  source: 'stated: S12 (instruction.md Rules 5, Checks)'
- rule: a Q arrival that came through D feeds the next latch's D, so borrowing passes along latch chains
  source: 'stated: S18 (instruction.md Rules 8, Level-sensitive latches)'
