[judge]
judge = "codex"
model = "openai/gpt-5.6-sol"
version = "0.164.0"
files = ["/app/out/136de480-2df4-5b30-8686-685cbc5749d7_D1_sta.py"]
mode = "batched"
isolated = false
cwd = "/app"
reasoning_effort = "high"
timeout = 600
guard = "penalize"

[scoring]
aggregation = "weighted-mean"

[[criterion]]
id = "J1"
name = "J1"
description = "D1 `/app/out/136de480-2df4-5b30-8686-685cbc5749d7_D1_sta.py` takes a cell delay, slew, or constraint value from a constant tuned to a design or library instead of looking it up in the library's NLDM tables at run time."
type = "binary"
weight = 1
negate = true

[criterion.annotations]
mode = "judged"
type = "ABSENCE"
obligation = "D1"
dimension = "constraints"
evidence = ["deliverable_file"]
residue = "whether a constant reproduces table values only on sampled operating points is a reading of the source no finite case set exhausts"

[[criterion]]
id = "J7"
name = "J7"
description = "D1 propagates one late and one early arrival per pin, transition, and launching group in topological order over its timing graph instead of enumerating paths."
type = "binary"
weight = 1
negate = false

[criterion.annotations]
mode = "judged"
type = "INVARIANT"
obligation = "D1"
dimension = "process"
evidence = ["deliverable_file"]
residue = "path enumeration that applies the same merge rule agrees with graph-based analysis on the sampled designs; the algorithm is a property of the code"

[[criterion]]
id = "J9"
name = "J9"
description = "D1 embeds a report, slack, arrival, borrow, or critical path for any design instead of computing it from the files it is given."
type = "binary"
weight = 1
negate = true

[criterion.annotations]
mode = "judged"
type = "ABSENCE"
obligation = "D1"
dimension = "constraints"
evidence = ["deliverable_file"]
residue = "whether a constant encodes design-derived results is a reading of program intent"
