schema_version = "1.4"
# The incident report comes from the agent's container. The trial record (O1-O4 from the collect
# step's replay, the expected incident set, the action log, the request log) comes from the
# ems-sim sidecar after the agent's container has stopped, so the agent can neither read nor
# edit it.
artifacts = [
  { source = "/app/out/249cfe22-173e-5a63-a907-25c23196b668_D2_incidents.json" },
  { source = "/var/ems/export/trial.json", service = "ems-sim" },
]
reward_type = "binary"

[task]
name = "ethara/249cfe22-173e-5a63-a907-25c23196b668"
version = "1.0.0"
description = "Dispatch a simulated island microgrid through a scheduled utility-tie outage over its API for 72 grid hours, follow the utility operator's mid-run revisions, and report every incident the grid hid."
authors = [{ name = "kanishk.singh", email = "kanishk.singh@ethara.ai" }, { name = "dhawal.bathre", email = "dhawal.bathre@ethara.ai" }]
keywords = ["microgrid", "ems", "operations", "dispatch", "sensor-faults", "island-mode", "battery-storage", "steerability"]

[metadata]
category = "Operations"
subcategory = "Grid operations"
tags = ["microgrid", "ems", "operations", "dispatch"]
platforms = ["linux/amd64", "linux/arm64"]
null_floor = 0.0
compilation_floor = 0.90
discrimination_weight = 0.238096
expert_time_estimate_hours = 10.0
reward_reading = "A trial passes only when its reward is exactly 1.0 (the rule trinity/tools/pilot_harbor.py applies); a continuous reward below 1.0 is never a pass, and the mean reward is reported beside the pass rate, never in its place."

[verifier]
timeout_sec = 3000.0
network_mode = "allowlist"
allowed_hosts = ["api.openai.com", "api.anthropic.com", "host.docker.internal"]
environment_mode = "separate"
user = "0"

[[verifier.collect]]
service = "ems-sim"
command = "env PYTHONPATH=/opt/ems python3 -m plantops.finalize"
timeout_sec = 120.0

[verifier.env]
ANTHROPIC_API_BASE = "${ANTHROPIC_API_BASE:-https://api.anthropic.com}"
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-}"
OPENAI_API_KEY = "${OPENAI_API_KEY:-}"
OPENAI_BASE_URL = "${OPENAI_BASE_URL:-https://api.openai.com/v1}"
LITELLM_LOCAL_MODEL_COST_MAP = "True"

[verifier.environment]
network_mode = "allowlist"
allowed_hosts = ["api.openai.com", "api.anthropic.com", "host.docker.internal"]
build_timeout_sec = 1200.0
cpus = 2
memory_mb = 4096
storage_mb = 8192
gpus = 0

[agent]
timeout_sec = 28800.0
network_mode = "public"
user = "1000:1000"

[environment]
network_mode = "public"
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096
storage_mb = 8192
gpus = 0
