schema: forge.grounding/v1
slot: 4
task: dhawal-bathre/stream-session-window-exactly-once
seed: 1729512491
weaponized_failure_mode: silent-divergence
silent_divergence: >-
  Correctness at event 40000 depends on merge and garbage-collection decisions at
  event 300, and there is no cheap invariant to re-derive window-table correctness
  short of replaying the whole trace in a second independent implementation. A wrong
  GC/close inequality direction, a missed late-event retraction cascade, a wrong
  merge trigger, or a checkpoint that omits the last-emitted sequence keeps emitting
  plausible records and is locally invisible; only a full-trace byte diff of the
  output (clean, and across a crash/resume boundary) exposes the defect.
reward_gating_items: [C1, C2]  # output_A byte-exact (w5) and output_B byte-exact across crash (w5)

deliverables:
  - id: D1
    slug: stream
    path: /app/stream
    desc: "single-threaded deterministic streaming engine; `stream run <trace> <out> <ckpt> [--resume]`"

# Field/semantics parameters. config_1 ships in /app/data/config.json; config_2 is a
# rubric re-pass with a different gap, lateness, and checkpoint interval, exercised by
# the verifier under a separate KVD_HOME. t=time is logical (watermark-driven) only.
params: {session_gap_ms: 30, allowed_lateness_ms: 60, checkpoint_interval: 7}
config_1: {session_gap_ms: 30, allowed_lateness_ms: 60, checkpoint_interval: 7}   # shipped in /app/data/config.json
config_2: {session_gap_ms: 50, allowed_lateness_ms: 100, checkpoint_interval: 5}  # rubric re-pass

# Canonical emission order within a single triggering message: (key, start, end, rank)
# with rank RETRACT=0 before FINAL=1. Output is JSONL (sorted keys), terminated by a
# single EOF record carrying dropped_late. `emit` is a 1-based gap-free monotone id.
contract:
  input_messages:
    event: '{"type":"event","key":<str>,"ts":<int>,"val":<int>,"seq":<int>}'
    watermark: '{"type":"watermark","ts":<int>}'
  window: "per key, a session [start,end] absorbs an event with start-gap <= ts <= end+gap; start=min ts, end=max ts"
  close_rule: "finalize a session when watermark > end + gap (strict)"
  gc_rule: "a finalized session is garbage-collected (no longer retractable) when watermark > end + gap + allowed_lateness (strict)"
  late_rule: "an event is dropped and counted when watermark - ts > allowed_lateness; otherwise it is applied, and if it falls within gap of finalized sessions it RETRACTs each and emits one merged re-FINAL"
  exactly_once: "the stream is delivered in chunks across process restarts; a non-final invocation persists full state atomically (temp+rename) and exits without EOF, a --resume invocation (handed only the unconsumed suffix) restores state and appends, --final flushes and writes EOF; the emit counter persists across chunks and the concatenated output is byte-identical to a single --final run"
  ack: "print `ACK <seq>` to stdout after each event message"

mutants:
  - id: MUT-LATE-DROP
    defect: "discards every late event (wm > ts) instead of applying it; never bridges or retracts finalized sessions"
    expect_fail: [C1, C2, C3, C5, C6, C10]
  - id: MUT-GC-EARLY
    defect: "finalizes a window on watermark >= end+gap instead of the strict > (off-by-one close-boundary direction)"
    expect_fail: [C1, C2, C5, C7, C10]
  - id: MUT-DUP-EMIT
    defect: "checkpoint omits the emit counter; on resume the emit numbering restarts from 1 instead of continuing, so the concatenated output has non-gapless/duplicated emit ids"
    expect_fail: [C2, C8, C10, C12]
  - id: MUT-SORT-ORDER
    defect: "emits records in processing/insertion order instead of the canonical (key,start,end,RETRACT<FINAL) order"
    expect_fail: [C1, C2, C6, C7]

compiled_rubric:
  - {id: C1, dimension: outcome, weight: 5, criterion: "on the primary seeded trace the clean-run output file is byte-identical to the reference output (no-crash correctness)"}
  - {id: C2, dimension: robustness, weight: 5, criterion: "the output file is byte-identical to the reference after the stream is split into two chunks at a seed-chosen boundary and run as first-chunk then --resume --final (exactly-once across one restart)"}
  - {id: C3, dimension: outcome, weight: 3, criterion: "the dropped_late count in the terminating EOF record matches the reference on the primary trace"}
  - {id: C4, dimension: robustness, weight: 3, criterion: "after resume no checkpoint .tmp file is left behind and every output line parses as JSON (atomic checkpoint, no partial write)"}
  - {id: C5, dimension: outcome, weight: 3, criterion: "under the second field config the clean-run output is byte-identical to the reference"}
  - {id: C6, dimension: coverage, weight: 3, criterion: "the set and order of RETRACT records match the reference on a retraction-heavy seed"}
  - {id: C7, dimension: outcome, weight: 3, criterion: "the set and order of FINAL records match the reference on the primary seed"}
  - {id: C8, dimension: robustness, weight: 3, criterion: "the stream split into three chunks (two restarts at different boundaries) still produces byte-identical output"}
  - {id: C9, dimension: coverage, weight: 3, criterion: "per-key session boundaries (merge across the gap) match the reference on a bridge-engineered seed"}
  - {id: C10, dimension: robustness, weight: 3, criterion: "under the second field config the crash-and-resume output is byte-identical to the reference"}
  - {id: C11, dimension: craft, weight: 1, criterion: "every output line is a JSON object with sorted keys and exactly the documented fields"}
  - {id: C12, dimension: constraints, weight: 1, criterion: "the emit ids are 1-based, strictly increasing by one, with no gaps or duplicates across the whole output"}
  - {id: C13, dimension: robustness, weight: 1, criterion: "two clean runs of the same trace produce identical output (determinism)"}
  - {id: C14, dimension: constraints, weight: 1, criterion: "a crash before the first checkpoint commits still resumes to a byte-identical output"}
  - {id: C15, dimension: craft, weight: 1, criterion: "the output ends with exactly one EOF record carrying dropped_late and nothing follows it"}

judged_rubric:
  - {id: J1, dimension: process, weight: 5, criterion: "Logical time advances only through watermark messages; no wall-clock or system-time call influences windowing, finalization, or the crash point."}
  - {id: J2, dimension: process, weight: 3, criterion: "A session groups events for one key whose timestamps lie within the configured gap, and its window is the minimum and maximum timestamp of its member events."}
  - {id: J3, dimension: process, weight: 3, criterion: "A window is finalized when the watermark passes end plus gap using the strict greater-than direction specified."}
  - {id: J4, dimension: process, weight: 3, criterion: "A late event within allowed lateness that falls within gap of one or more finalized sessions retracts each of them and emits a single merged re-FINAL."}
  - {id: J5, dimension: process, weight: 3, criterion: "An event whose watermark-minus-timestamp exceeds allowed lateness is dropped and counted, never applied to any window."}
  - {id: J6, dimension: constraints, weight: 3, criterion: "The checkpoint records the emit counter so a resumed invocation continues the gapless 1..N numbering instead of restarting it."}
  - {id: J7, dimension: process, weight: 3, criterion: "Records emitted for a single triggering message are ordered by the canonical key of key then start then end with RETRACT before FINAL, not by processing or insertion order."}
  - {id: J8, dimension: robustness, weight: 3, criterion: "Checkpoints are written atomically by writing a temporary file and renaming it, so a crash never leaves a partially written checkpoint."}
  - {id: J9, dimension: outcome, weight: 3, criterion: "The count and sum reported for a session are the exact totals of its member events after every merge."}
  - {id: J10, dimension: robustness, weight: 1, criterion: "The program makes no network call and spawns no subprocess."}
  - {id: J11, dimension: robustness, weight: 1, criterion: "No per-trace output, session boundary, or dropped count is hard-coded in the program."}
  - {id: J12, dimension: craft, weight: 1, criterion: "The deliverable is one self-contained executable using only the Python standard library."}
  - {id: J13, dimension: constraints, weight: 1, criterion: "A finalized session is garbage-collected only once no allowed-late event can still reach it, when the watermark passes end plus gap plus allowed lateness."}
  - {id: J14, dimension: craft, weight: 1, criterion: "The output is JSON Lines with sorted keys and a single terminating EOF record carrying the dropped-late count."}

judge:
  backend: codex              # AgentJudge -> codex CLI (ChatGPT identity), not litellm; subscription-safe
  model: openai/gpt-6.1-sol   # real codex-served model
  version: "0.164.0"          # pinned to the codex binary baked into tests/Dockerfile
  files: ["/app/stream"]
  mode: batched
  isolated: false
  cwd: /app
  reasoning_effort: high      # -> codex CLI --effort, not litellm (no UnsupportedParamsError)
  timeout: 600                # MUST be < task.toml [verifier].timeout_sec (900) to avoid kill-before-graceful
  guard: penalize

# Rubric audit (operator directive): graded reward >= 90% deterministic.
compilation_floor: 0.9
rubric_directive: >-
  Judged weight is demand-driven and capped at 10 percent (compilation_floor 0.9): fill it ONLY with genuinely irreducible, quality-only, non-gating (Bucket N) items that clear a multi-LLM-agreement bar; never pad to reach 10 percent.
rubric_audit:
  bar: "genuinely irreducible, quality-only, non-gating (Bucket N); clears Harbor multi-LLM-agreement"
  method: "J1-J14 reducibility audit against the slot's compiled carrier"
  verdict: "every judged item grades a method/quality signal (watermark-only time, inequality direction, atomic checkpoint, canonical order, GC timing) the byte-exact compiled carrier enforces on-output but does not name in source; retained as context, never gating"
  judged_retained: "all judged items retained as the <= 10% non-gating carrier, each keeping its 1/3/5 weight"
  carrier_split: "compiled 90%, judged 10% via tests/reward.toml weights test_output=9 judge=1"
  graded_reward: "0.9 * compiled + 0.1 * judged; the judged carrier (codex AgentJudge, openai/gpt-6.1-sol) is deferred to pilot (no credential this run) and can never gate because it is <= 10%"

# Pilot plan (operator directive). Stage 1 local: oracle + alternate byte-identical across
# 20 runs incl crash/resume; each mutant isolates to its gate and drops >= 0.20. Stage 2:
# pass@4 Opus-5.5; if pass@1 > ~25%, deepen late-merge cascade density across GC boundaries
# (raise trace length / overlap), never add new constraints.
measurement_gate: "pass@4 Opus-5.5 on the sealed task; operator-run (no pilot compute this run)"
