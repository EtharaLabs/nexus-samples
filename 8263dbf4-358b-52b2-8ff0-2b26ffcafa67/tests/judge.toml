[[criterion]]
id = "J1"
description = "Logical time advances only through watermark messages from the input, or the single documented end-of-trace advance that flushes remaining open windows before the EOF record (instruction Section 5); no wall-clock, system-time, or random source influences windowing, finalization, or the crash point. A program that implements no windowing or finalization logic does not satisfy this."
type = "binary"
weight = 5
[criterion.annotations]
dimension = "process"
mode = "judged"

[[criterion]]
id = "J2"
description = "A session groups events for one key whose timestamps lie within the configured gap, and its window is the minimum and maximum timestamp of its member events."
type = "binary"
weight = 3
[criterion.annotations]
dimension = "process"
mode = "judged"

[[criterion]]
id = "J3"
description = "A window is finalized when the watermark passes end plus gap using the strict greater-than direction specified."
type = "binary"
weight = 3
[criterion.annotations]
dimension = "process"
mode = "judged"

[[criterion]]
id = "J4"
description = "A late event within allowed lateness that falls within gap of one or more finalized sessions retracts each of them and merges; the merged session is then immediately re-finalized with one FINAL if it still satisfies watermark greater than end plus gap, or otherwise reopened with no re-FINAL, per instruction Section 3. The RETRACT records must always be emitted and both the re-FINAL and reopen branches are correct."
type = "binary"
weight = 3
[criterion.annotations]
dimension = "process"
mode = "judged"

[[criterion]]
id = "J5"
description = "An event whose watermark-minus-timestamp exceeds allowed lateness is dropped and counted, never applied to any window."
type = "binary"
weight = 3
[criterion.annotations]
dimension = "process"
mode = "judged"

[[criterion]]
id = "J6"
description = "The checkpoint records the emit counter so a resumed invocation continues the gapless 1..N numbering instead of restarting it."
type = "binary"
weight = 3
[criterion.annotations]
dimension = "constraints"
mode = "judged"

[[criterion]]
id = "J7"
description = "Records emitted for a single triggering message are ordered by the tuple (key, start, end), with RETRACT before FINAL only as the tie-break for records sharing an identical (key, start, end); start and end take priority over record type, not processing or insertion order."
type = "binary"
weight = 3
[criterion.annotations]
dimension = "process"
mode = "judged"

[[criterion]]
id = "J8"
