schema_version = "1.4"
reward_type = "binary"
# The incident report comes from the agent's container. The trial record (O1-O4 from the collect
# step's replay, the expected incident set, the action log, the request log) comes from the
# scada-sim sidecar after the agent's container has stopped, so the agent can neither read nor
# edit it.
artifacts = [
  { source = "/app/out/6c55cb9f-e734-5025-8e5f-43ef2f4336fa_D2_incidents.json" },
  { source = "/var/scada/export/trial.json", service = "scada-sim" },
]

[task]
name = "ethara/bfd3ac37-bf5e-55e0-9730-c3fa2222a737"
version = "1.0.0"
description = "Operate a simulated district-heating plant through its SCADA API for 72 plant hours so that a cold snap passes without breaking the customer contract, and report every incident the plant hid."
authors = [{ name = "kanishk.singh", email = "kanishk.singh@ethara.ai" }]
keywords = ["district-heating", "scada", "operations", "control", "sensor-faults", "npsh", "condensing-boilers", "thermal-storage"]

[metadata]
category = "Operations"
subcategory = "Plant operations"
tags = ["district-heating", "scada", "operations", "control"]
platforms = ["linux/amd64", "linux/arm64"]
null_floor = 0.0
compilation_floor = 0.90
discrimination_weight = 0.238096
expert_time_estimate_hours = 10.0
reward_reading = "The reward is binary: 1 only when the Reward Kit score (1.0 x compiled + 0.0 x judged, per tests/reward.toml) is exactly 1.0, that is when every compiled item O1-O5 passes, otherwise 0; the judged items are reported without changing the reward. The mean reward is the pass rate."

[verifier]
timeout_sec = 3000.0
network_mode = "allowlist"
allowed_hosts = ["api.openai.com", "api.anthropic.com", "host.docker.internal"]
environment_mode = "separate"
user = "2000:2000"

[[verifier.collect]]
service = "scada-sim"
command = "python3 /opt/scada/finalize.py"
timeout_sec = 120.0

[verifier.env]
ANTHROPIC_API_BASE = "${ANTHROPIC_API_BASE:-https://api.anthropic.com}"
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-}"
OPENAI_API_KEY = "${OPENAI_API_KEY:-}"
OPENAI_BASE_URL = "${OPENAI_BASE_URL:-https://api.openai.com/v1}"
LITELLM_LOCAL_MODEL_COST_MAP = "True"

[verifier.environment]
network_mode = "allowlist"
allowed_hosts = ["api.openai.com", "api.anthropic.com", "host.docker.internal"]
build_timeout_sec = 1200.0
cpus = 2
memory_mb = 4096
storage_mb = 8192
gpus = 0

[agent]
timeout_sec = 14400.0
network_mode = "public"
user = "1000:1000"

[environment]
network_mode = "public"
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096
storage_mb = 8192
gpus = 0
